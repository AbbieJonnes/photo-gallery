<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-2xl mx-auto px-6 py-10">

        <a href="{% url 'home' %}"
           class="text-blue-600 hover:underline">
            <i class="fa-solid fa-arrow-left mr-1"></i>
            Back to Gallery
        </a>

        <div class="bg-white rounded-xl shadow-md p-8 mt-6">

            <div class="text-center mb-8">
                <div class="text-blue-600 text-4xl mb-3">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>

                <h1 class="text-3xl font-bold">
                    Upload Photo
                </h1>

                <p class="text-gray-500 mt-2">
                    Share your favorite moments with the gallery.
                </p>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-5">
                        <p class="font-semibold mb-2">
                            Please correct the errors below.
                        </p>
                        {{ form.errors }}
                    </div>
                {% endif %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                    <i class="fa-solid fa-upload mr-2"></i>
                    Upload Photo
                </button>
            </form>

        </div>

    </div>

</body>
</html>
