<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ photo.title }} - Photo Gallery</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="{% url 'home' %}"
               class="text-2xl font-bold text-blue-600">
                <i class="fa-solid fa-camera mr-2"></i>
                Photo Gallery
            </a>

            <a href="{% url 'home' %}"
               class="text-gray-600 hover:text-blue-600">
                <i class="fa-solid fa-arrow-left mr-1"></i>
                Back to Gallery
            </a>

        </div>
    </nav>


    <main class="max-w-5xl mx-auto px-6 py-10">

        <div class="bg-white rounded-xl shadow-md overflow-hidden">

            <img src="{{ photo.image.url }}"
                 alt="{{ photo.title }}"
                 class="w-full max-h-[600px] object-contain bg-gray-900">

            <div class="p-8">

                <h1 class="text-3xl font-bold text-gray-900">
                    {{ photo.title }}
                </h1>

                <div class="flex items-center gap-2 text-gray-500 mt-3">
                    <i class="fa-solid fa-user"></i>
                    <span>Uploaded by {{ photo.user.username }}</span>
                </div>

                {% if photo.description %}
                    <div class="mt-6">
                        <h2 class="text-lg font-semibold mb-2">
                            Description
                        </h2>

                        <p class="text-gray-600">
                            {{ photo.description }}
                        </p>
                    </div>
                {% endif %}

                {% if photo.tags %}
                    <div class="mt-6">
                        <h2 class="text-lg font-semibold mb-3">
                            Tags
                        </h2>

                        <div class="flex flex-wrap gap-2">
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full">
                                {{ photo.tags }}
                            </span>
                        </div>
                    </div>
                {% endif %}

                <div class="border-t mt-8 pt-6 text-gray-500">
                    <i class="fa-regular fa-calendar mr-1"></i>
                    Uploaded on {{ photo.created_at|date:"F d, Y" }}
                </div>

            </div>

        </div>

    </main>

</body>
</html>
